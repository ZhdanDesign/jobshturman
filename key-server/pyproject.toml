[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrs-keys"
version = "0.1.0"
description = "JobShturman key server: keys, tariffs, activations and the signed methodology bundle. No personal data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "hrshturman-core",
]

[project.scripts]
hrs-keys = "hrs_keys.cli:main"

[tool.setuptools]
packages = ["hrs_keys"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.sources]
hrshturman-core = { path = "../core", editable = true }

[tool.ruff]
line-length = 120
