[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrshturman"
version = "0.9.4.4"
description = "JobShturman CLI: local MCP server, vacancy collector and document import for coding agents"
requires-python = ">=3.12"
dependencies = [
    "hrshturman-core>=0.4.1",
    "hrshturman-local>=0.3.7",
    "hrs-collector>=0.2.1",
    "mcp>=2.3,<3",
    "markitdown[docx,pdf]>=0.1",
    "httpx>=0.27",
    "cryptography>=43",
]

[dependency-groups]
# Only for tests: the real key server runs in-process.
dev = ["hrs-keys"]

[project.scripts]
jbs = "hrs_cli.main:main"
# The old name stays: installed agents, schedules and self-update call hrs.
hrs = "hrs_cli.main:main"

[tool.setuptools]
packages = ["hrs_cli"]

[tool.setuptools.package-data]
hrs_cli = ["static/*"]

[tool.uv.sources]
hrshturman-core = { path = "../core", editable = true }
hrshturman-local = { path = "../local-app", editable = true }
hrs-collector = { path = "../collector", editable = true }
hrs-keys = { path = "../key-server", editable = true }
