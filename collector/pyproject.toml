[project]
name = "hrs-collector"
version = "0.2.0"
description = "JobShturman vacancy collector: HeadHunter, Telegram and LinkedIn adapters behind one core, with HTTP API and MCP server"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]

[project.scripts]
hrs-collector = "hrs_collector.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrs_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
